name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=0
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository secret $v is not set. Add it under Settings -> Secrets and variables -> Actions."
              missing=1
            fi
          done
          exit $missing

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        env:
          OBY_STORE_FILE: ${{ runner.temp }}/release.jks
          OBY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OBY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OBY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK signature
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$SDK/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" "OpenBehindYou-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "OpenBehindYou-${GITHUB_REF_NAME}.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "OpenBehindYou-${GITHUB_REF_NAME}.apk" \
              --title "OpenBehindYou $GITHUB_REF_NAME" \
              --generate-notes
          fi
